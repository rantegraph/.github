<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Open source at Rante</title>
  <desc id="desc">Rante Open Source: read the code, use it in your own projects, and follow its development on GitHub.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1827"/>
      <stop offset="0.6" stop-color="#102033"/>
      <stop offset="1" stop-color="#13314f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#0067b8" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#0067b8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="92" fill="#9fd8ff" font-size="15" font-weight="700" letter-spacing="3">RANTE OPEN SOURCE</text>
    <text x="64" y="158" fill="#ffffff" font-size="52" font-weight="600">Open source at Rante.</text>
    <text x="64" y="200" fill="#c7d3e3" font-size="20">Read the code, use it in your own projects, and follow its development on GitHub.</text>
  </g>
  <g transform="translate(64 228)">
    <rect width="736" height="58" rx="10" fill="#0f1b2b" stroke="#9fd8ff" stroke-opacity="0.2"/>
    <circle cx="24" cy="29" r="5" fill="#ffffff" fill-opacity="0.28"/>
    <circle cx="42" cy="29" r="5" fill="#ffffff" fill-opacity="0.28"/>
    <circle cx="60" cy="29" r="5" fill="#ffffff" fill-opacity="0.28"/>
    <text x="84" y="35" font-family="'Cascadia Code', 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, Monaco, 'Courier New', monospace" font-size="16"><tspan fill="#9fd8ff">git clone</tspan><tspan fill="#e6edf6"> https://github.com/rantegraph/rante-login-sdk.git</tspan></text>
  </g>
</svg>
